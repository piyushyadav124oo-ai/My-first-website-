<style>
:root {
  --bg: #070816;
  --bg2: #0c1025;
  --card: rgba(19, 25, 52, 0.76);
  --blue: #42d9ff;
  --purple: #9b6bff;
  --pink: #f05bff;
  --green: #42ffc8;
  --text: #f4f6ff;
  --muted: #a4acc8;
  --border: rgba(143, 164, 255, 0.19);
  --shadow: 0 0 45px rgba(65, 125, 255, 0.12);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
  line-height: 1.65;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -3;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 15% 15%, #37208035, transparent 38%),
    radial-gradient(ellipse at 85% 35%, #006a9630, transparent 38%),
    radial-gradient(ellipse at 50% 85%, #641a8030, transparent 40%),
    #070816;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  opacity: .14;
  background-image:
    linear-gradient(rgba(89, 126, 255, .15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(89, 126, 255, .15) 1px, transparent 1px);
  background-size: 55px 55px;
  mask-image: linear-gradient(to bottom, black, transparent 85%);
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

img {
  max-width: 100%;
  display: block;
}

.container {
  width: min(1180px, 92%);
  margin: auto;
}

section {
  padding: 95px 0;
  position: relative;
}

.section-label {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 50px;
  background: #ffffff08;
  color: var(--blue);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.section-title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(27px, 4vw, 43px);
  line-height: 1.25;
  margin: 20px 0 15px;
  letter-spacing: -1px;
}

.section-desc {
  max-width: 680px;
  margin: auto;
  color: var(--muted);
  font-size: 15px;
}

.gradient-text {
  background: linear-gradient(100deg, var(--blue), var(--purple), var(--pink));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.center {
  text-align: center;
}

.glow-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 15px var(--green);
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .45; transform: scale(.72); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

@keyframes rotate3d {
  from { transform: rotateY(0deg) rotateX(0deg); }
  to { transform: rotateY(360deg) rotateX(360deg); }
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 18px #5e72ff20; }
  50% { box-shadow: 0 0 38px #5e72ff55; }
}

@keyframes scan {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(400%); }
}

@keyframes orbit {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(28px); }
  to { opacity: 1; transform: translateY(0); }
}

/* NAVIGATION */

.navbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(7, 8, 22, .82);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.nav-inner {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: 17px;
  white-space: nowrap;
}

.logo-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  font-size: 22px;
  background: linear-gradient(135deg, #315cff, #b64dff);
  box-shadow: 0 0 24px #735bff55;
}

.logo span {
  color: var(--blue);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 22px;
}

.nav-links a {
  font-size: 12px;
  color: #c2c9e3;
  transition: .3s;
}

.nav-links a:hover {
  color: var(--blue);
}

.nav-cta {
  padding: 11px 17px;
  border-radius: 10px;
  color: white;
  font-size: 12px;
  font-weight: 700;
  background: linear-gradient(110deg, #4968ff, #984cff);
  box-shadow: 0 0 25px #705aff30;
}

.menu-btn {
  display: none;
  background: #ffffff0b;
  border: 1px solid var(--border);
  color: white;
  padding: 8px 12px;
  border-radius: 9px;
}

/* HERO SECTION */

.hero {
  min-height: 650px;
  display: flex;
  align-items: center;
  padding: 85px 0 65px;
  overflow: hidden;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: 30px;
  align-items: center;
}

.hero-content {
  animation: fadeUp .9s both;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  border-radius: 50px;
  border: 1px solid #6b7cff55;
  background: #536bff12;
  font-size: 11px;
  color: #d8d9ff;
  margin-bottom: 24px;
}

.hero h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(34px, 5vw, 62px);
  line-height: 1.15;
  letter-spacing: -2px;
  margin-bottom: 24px;
}

.hero p {
  color: var(--muted);
  font-size: 15px;
  max-width: 520px;
  margin-bottom: 30px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
}

.btn-primary, .btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 14px 20px;
  border-radius: 12px;
  border: 1px solid transparent;
  font-size: 13px;
  font-weight: 700;
  transition: transform .3s, box-shadow .3s;
}

.btn-primary {
  color: white;
  background: linear-gradient(115deg, #426bff, #a04dff);
  box-shadow: 0 8px 30px #655bff35;
}

.btn-secondary {
  border-color: var(--border);
  background: #ffffff08;
  color: white;
}

.btn-primary:hover, .btn-secondary:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 30px #6c69ff35;
}

.hero-note {
  margin-top: 25px;
  font-size: 11px;
  color: #858eae;
}

/* 3D AI CHIP */

.chip-scene {
  position: relative;
  min-height: 430px;
  display: grid;
  place-items: center;
  perspective: 1000px;
  isolation: isolate;
}

.chip-aura {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, #5555ff48, #a348ff20 40%, transparent 70%);
  filter: blur(18px);
  animation: pulse 4s infinite;
}

.chip-orbit {
  position: absolute;
  width: 340px;
  height: 340px;
  border: 1px solid #5c91ff48;
  border-radius: 50%;
  transform: rotateX(68deg);
  animation: orbit 16s linear infinite;
}

.chip-orbit::before {
  content: "";
  position: absolute;
  top: 20px;
  left: 48px;
  width: 12px;
  height: 12px;
  background: var(--blue);
  border-radius: 50%;
  box-shadow: 0 0 20px var(--blue);
}

.chip-orbit.orbit-two {
  width: 270px;
  height: 270px;
  border-color: #b85cff55;
  transform: rotateX(68deg) rotateZ(60deg);
  animation-direction: reverse;
}

.chip-orbit.orbit-three {
  width: 390px;
  height: 390px;
  border-style: dashed;
  border-color: #6d6aff30;
  animation-duration: 30s;
}

.ai-chip {
  position: relative;
  width: 200px;
  height: 200px;
  display: grid;
  place-items: center;
  border-radius: 30px;
  background:
    linear-gradient(145deg, #18285a, #101127 48%, #29124e);
  border: 2px solid #8c9aff;
  box-shadow:
    0 0 30px #536aff75,
    0 0 75px #8a48ff40,
    inset 0 0 35px #4b6bff45;
  transform: rotateX(12deg) rotateY(-15deg);
  animation: float 5s ease-in-out infinite, glow 4s infinite;
  z-index: 2;
}

.ai-chip::before {
  content: "";
  position: absolute;
  inset: -13px;
  border: 1px solid #55bfff8c;
  border-radius: 35px;
  transform: translateZ(-15px);
}

.ai-chip::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 28px;
  background: linear-gradient(transparent, #65e4ff12, transparent);
  pointer-events: none;
}

.chip-inner {
  width: 130px;
  height: 130px;
  border: 1px solid #6eafff80;
  border-radius: 22px;
  display: grid;
  place-items: center;
  text-align: center;
  background: radial-gradient(circle, #4d67ff38, #13152c 70%);
}

.chip-inner strong {
  display: block;
  font-family: 'Orbitron', sans-serif;
  font-size: 29px;
  color: white;
  text-shadow: 0 0 20px var(--blue);
}

.chip-inner small {
  display: block;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--blue);
}

.chip-pin {
  position: absolute;
  width: 13px;
  height: 4px;
  background: linear-gradient(90deg, var(--blue), var(--purple));
  box-shadow: 0 0 10px var(--blue);
}

.pin-top { top: -6px; }
.pin-bottom { bottom: -6px; }
.pin-left { left: -6px; width: 4px; height: 13px; }
.pin-right { right: -6px; width: 4px; height: 13px; }

.chip-label {
  position: absolute;
  z-index: 3;
  padding: 10px 13px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #10142de8;
  backdrop-filter: blur(15px);
  box-shadow: var(--shadow);
  font-size: 10px;
  color: #dce4ff;
  animation: float 5s ease-in-out infinite;
}

.chip-label.one { top: 55px; left: 0; }
.chip-label.two { right: 0; top: 115px; animation-delay: -2s; }
.chip-label.three { bottom: 45px; left: 15px; animation-delay: -3s; }

.label-dot {
  color: var(--green);
  margin-right: 5px;
}

/* TRUST STRIP */

.trust-strip {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: #ffffff03;
  padding: 25px 0;
}

.trust-inner {
  display: flex;
  align-items: center;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 20px;
}

.trust-item {
  color: #a8b1d2;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 9px;
}

/* TOOL CARDS */

.tools-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  margin-top: 45px;
}

.tool-card {
  position: relative;
  overflow: hidden;
  padding: 16px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transform-style: preserve-3d;
  transition: transform .35s, border-color .35s, box-shadow .35s;
}

.tool-card:hover {
  transform: translateY(-8px) rotateX(2deg);
  border-color: #7a8fff9c;
  box-shadow: 0 18px 45px #5768ff20;
}

.tool-visual {
  height: 175px;
  overflow: hidden;
  position: relative;
  border-radius: 14px;
  margin-bottom: 18px;
  background: #11162e;
}

.tool-visual img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .7s;
}

.tool-card:hover .tool-visual img {
  transform: scale(1.08);
}

.tool-visual::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, #090b1b99, transparent 70%);
  pointer-events: none;
}

.tool-icon {
  position: absolute;
  z-index: 2;
  left: 13px;
  bottom: 12px;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 1px solid #ffffff35;
  background: #10152bd9;
  backdrop-filter: blur(10px);
  font-size: 22px;
}

.tool-card h3 {
  font-size: 17px;
  margin-bottom: 8px;
}

.tool-card p {
  font-size: 12px;
  line-height: 1.8;
  color: var(--muted);
  margin-bottom: 18px;
}

.tool-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.tool-tag {
  font-size: 10px;
  padding: 5px 9px;
  border-radius: 20px;
  background: #7b6aff18;
  color: #c3baff;
  border: 1px solid #8e7bff25;
}

.tool-open {
  color: white;
  border: 1px solid var(--border);
  background: #ffffff07;
  border-radius: 9px;
  padding: 9px 12px;
} 
 /* ===== FEATURES ===== */
.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 35px;
}

.feature-card {
  padding: 25px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 20px;
  transition: .3s ease;
}

.feature-card:hover {
  transform: translateY(-7px);
  border-color: var(--primary);
  box-shadow: 0 10px 35px #7c3aed22;
}

.feature-icon {
  width: 55px;
  height: 55px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: linear-gradient(135deg, #7c3aed33, #06b6d433);
  font-size: 26px;
  margin-bottom: 17px;
}

.feature-card h3 {
  margin-bottom: 10px;
}

.feature-card p {
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
}

.studio-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
}

.studio-card {
  min-height: 230px;
  position: relative;
  overflow: hidden;
  border-radius: 22px;
  padding: 28px;
  border: 1px solid var(--border);
  background:
    radial-gradient(circle at 90% 10%, #7c3aed35, transparent 45%),
    var(--panel);
}

.studio-card h3 {
  font-size: 23px;
  margin: 15px 0 10px;
}

.studio-card p {
  color: var(--muted);
  line-height: 1.7;
}

.studio-art {
  font-size: 52px;
  margin-top: 15px;
}

.steps-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.step-card {
  padding: 25px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--panel);
}

.step-number {
  font-size: 32px;
  font-weight: 900;
  color: var(--primary);
  margin-bottom: 14px;
}

.step-card p {
  color: var(--muted);
  line-height: 1.7;
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 35px;
  align-items: center;
}

.about-visual {
  min-height: 320px;
  display: grid;
  place-items: center;
  border-radius: 25px;
  border: 1px solid var(--border);
  background:
    radial-gradient(circle at center, #7c3aed44, transparent 65%),
    var(--panel);
}

.about-orb {
  width: 180px;
  height: 180px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 65px;
  background: linear-gradient(135deg, #7c3aed, #06b6d4);
  box-shadow: 0 0 70px #7c3aed55;
  animation: float 4s ease-in-out infinite;
}

.about-text p {
  color: var(--muted);
  line-height: 1.9;
  margin: 15px 0;
}

@media (max-width: 850px) {
  .feature-grid,
  .steps-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .about-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 550px) {
  .feature-grid,
  .studio-grid,
  .steps-grid {
    grid-template-columns: 1fr;
  }
}

<!-- WORKSPACE MODAL -->
<div
  id="workspaceModal"
  class="workspace-modal"
  aria-hidden="true"
>
  <div class="workspace-backdrop" data-close-modal></div>

  <div
    class="workspace-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="workspaceTitle"
  >
    <div class="workspace-header">
      <div>
        <span class="eyebrow">✦ CREATIVE WORKSPACE</span>
        <h2 id="workspaceTitle">AI Workspace</h2>
      </div>

      <button
        id="closeWorkspace"
        class="modal-close"
        type="button"
        aria-label="Close workspace"
      >
        ×
      </button>
    </div>

    <p id="workspaceDescription">
      Describe your idea to create a sample draft.
    </p>

    <label for="workspacePrompt">Describe your idea</label>

    <textarea
      id="workspacePrompt"
      rows="5"
      placeholder="Type your idea here..."
    ></textarea>

    <button
      id="generateDraft"
      class="btn btn-primary"
      type="button"
    >
      Create Demo Draft ✨
    </button>

    <div id="workspaceResult" class="workspace-result" hidden>
      <h3>Your Draft</h3>
      <pre id="workspaceOutput"></pre>

      <button
        id="copyDraft"
        class="btn btn-secondary"
        type="button"
      >
        Copy Draft
      </button>
    </div>

    <p class="form-note">
      Demo mode: this workspace does not connect to a live AI service.
    </p>
  </div>
</div>
<script>
/* =========================================
   PIYUSH AI WORLD — JAVASCRIPT
========================================= */

document.addEventListener("DOMContentLoaded", function () {

  const $ = (selector) => document.querySelector(selector);
  const $$ = (selector) => document.querySelectorAll(selector);

  /* ===== CURRENT YEAR ===== */
  const yearElement = $("#currentYear");

  if (yearElement) {
    yearElement.textContent = new Date().getFullYear();
  }

  /* ===== TOAST MESSAGE ===== */
  let toastTimer;

  function showToast(message) {
    const toast = $("#toast");

    if (!toast) {
      alert(message);
      return;
    }

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(function () {
      toast.classList.remove("show");
    }, 2800);
  }

  /* ===== MOBILE NAVIGATION ===== */
  const menuToggle = $("#menuToggle");
  const navLinks = $("#navLinks");

  if (menuToggle && navLinks) {
    menuToggle.addEventListener("click", function () {
      const isOpen = navLinks.classList.toggle("active");

      menuToggle.setAttribute("aria-expanded", String(isOpen));
      menuToggle.setAttribute(
        "aria-label",
        isOpen ? "Close navigation menu" : "Open navigation menu"
      );
    });

    $$("#navLinks a").forEach(function (link) {
      link.addEventListener("click", function () {
        navLinks.classList.remove("active");
        menuToggle.setAttribute("aria-expanded", "false");
      });
    });
  }

  /* ===== SCROLL REVEAL ===== */
  if ("IntersectionObserver" in window) {
    const revealObserver = new IntersectionObserver(
      function (entries, observer) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.12 }
    );

    $$(".reveal").forEach(function (element) {
      revealObserver.observe(element);
    });
  } else {
    $$(".reveal").forEach(function (element) {
      element.classList.add("visible");
    });
  }

  /* ===== CARD HOVER EFFECT ===== */
  $$(".tool-card, .feature-card, .studio-card").forEach(function (card) {
    card.addEventListener("pointermove", function (event) {
      if (event.pointerType === "touch") return;

      const rect = card.getBoundingClientRect();

      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      card.style.setProperty("--mouse-x", x + "px");
      card.style.setProperty("--mouse-y", y + "px");
    });
  });

  /* ===== BACK TO TOP ===== */
  const backToTop = $("#backToTop");

  if (backToTop) {
    window.addEventListener("scroll", function () {
      backToTop.classList.toggle("show", window.scrollY > 500);
    });

    backToTop.addEventListener("click", function () {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  }

  /* ===== FAQ ACCORDION ===== */
  $$(".faq-item").forEach(function (item) {
    item.addEventListener("toggle", function () {
      if (!item.open) return;

      $$(".faq-item").forEach(function (otherItem) {
        if (otherItem !== item) {
          otherItem.open = false;
        }
      });
    });
  });

  /* ===== WORKSPACE MODAL ===== */
  const modal = $("#workspaceModal");
  const closeModalButton = $("#closeWorkspace");
  const workspaceTitle = $("#workspaceTitle");
  const workspaceDescription = $("#workspaceDescription");
  const workspacePrompt = $("#workspacePrompt");
  const generateButton = $("#generateDraft");
  const workspaceResult = $("#workspaceResult");
  const workspaceOutput = $("#workspaceOutput");
  const copyDraftButton = $("#copyDraft");

  let activeTool = "chat";

  const toolInformation = {
    chat: {
      title: "AI Chat Assistant",
      description: "Enter a question or topic for a sample response.",
      placeholder: "Example: Explain solar energy in simple Hindi."
    },

    image: {
      title: "AI Image Studio",
      description: "Describe an image to create a sample image prompt.",
      placeholder: "Example: A futuristic city at sunset, cinematic lighting."
    },

    video: {
      title: "AI Video Studio",
      description: "Describe your idea for a sample video script.",
      placeholder: "Example: A 30-second video about India's history."
    },

    story: {
      title: "AI Story Writer",
      description: "Enter a topic for a sample story outline.",
      placeholder: "Example: An inspiring story about a village student."
    },

    voice: {
      title: "AI Voice Studio",
      description: "Enter a topic for a sample narration script.",
      placeholder: "Example: A motivational Hindi voice-over."
    },

    code: {
      title: "AI Code Assistant",
      description: "Describe a coding task for a sample coding plan.",
      placeholder: "Example: Create a simple calculator using HTML."
    }
  };

  function openWorkspace(tool) {
    if (!modal) {
      showToast("Workspace is unavailable.");
      return;
    }

    activeTool = toolInformation[tool] ? tool : "chat";

    const info = toolInformation[activeTool];

    if (workspaceTitle) {
      workspaceTitle.textContent = info.title;
    }

    if (workspaceDescription) {
      workspaceDescription.textContent = info.description;
    }

    if (workspacePrompt) {
      workspacePrompt.placeholder = info.placeholder;
      workspacePrompt.value = "";
    }

    if (workspaceResult) {
      workspaceResult.hidden = true;
    }

    if (workspaceOutput) {
      workspaceOutput.textContent = "";
    }

    modal.classList.add("active");
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("modal-open");

    if (workspacePrompt) {
      setTimeout(function () {
        workspacePrompt.focus();
      }, 100);
    }
  }

  function closeWorkspace() {
    if (!modal) return;

    modal.classList.remove("active");
    modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-open");
  }

  $$("[data-open-tool]").forEach(function (button) {
    button.addEventListener("click", function () {
      openWorkspace(button.getAttribute("data-open-tool"));
    });
  });

  if (closeModalButton) {
    closeModalButton.addEventListener("click", closeWorkspace);
  }

  $$("[data-close-modal]").forEach(function (element) {
    element.addEventListener("click", closeWorkspace);
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeWorkspace();
    }
  });

  /* ===== DEMO DRAFT GENERATOR ===== */
  function createDemoDraft(tool, prompt) {
    const topic = prompt.trim();

    if (tool === "image") {
      return [
        "IMAGE PROMPT",
        "",
        "Subject: " + topic,
        "Style: Highly detailed digital artwork",
        "Lighting: Cinematic lighting and soft shadows",
        "Composition: Balanced framing and clear focal point",
        "Quality: Detailed textures and professional finish",
        "",
        "Note: This is a text prompt, not a generated image."
      ].join("\n");
    }

    if (tool === "video") {
      return [
        "VIDEO SCRIPT DRAFT",
        "",
        "Topic: " + topic,
        "",
        "HOOK:",
        "What if you could discover something amazing about this topic?",
        "",
        "SCENE 1:",
        "Introduce the topic with a clear visual.",
        "",
        "SCENE 2:",
        "Explain the main idea using engaging narration.",
        "",
        "ENDING:",
        "Summarize the message and invite viewers to share their thoughts.",
        "",
        "Note: Edit the draft to match your video."
      ].join("\n");
    }

    if (tool === "story") {
      return [
        "STORY OUTLINE",
        "",
        "Topic: " + topic,
        "",
        "1. BEGINNING",
        "Introduce the main character and their world.",
        "",
        "2. CHALLENGE",
        "A difficult situation forces the character to make a choice.",
        "",
        "3. JOURNEY",
        "The character learns, grows and faces new challenges.",
        "",
        "4. CLIMAX",
        "The main problem reaches its turning point.",
        "",
        "5. ENDING",
        "Resolve the story with a meaningful lesson.",
        "",
        "Moral: Courage and persistence can help us overcome challenges."
      ].join("\n");
    }

    if (tool === "voice") {
      return [
        "VOICE-OVER DRAFT",
        "",
        "Topic: " + topic,
        "",
        "Namaskar dosto!",
        "Aaj hum baat karne wale hain " + topic + " ke baare mein.",
        "Is vishay ko samajhna bahut dilchasp ho sakta hai.",
        "Chaliye, shuru karte hain aur iske mukhya pehluon ko jaante hain.",
        "",
        "Dhanyavaad! Video pasand aaye to apni rai zaroor batayein."
      ].join("\n");
    }

    if (tool === "code") {
      return [
        "CODING PLAN",
        "",
        "Task: " + topic,
        "",
        "Step 1: Define the required features.",
        "Step 2: Choose the appropriate programming language.",
        "Step 3: Build the basic structure.",
        "Step 4: Implement the functionality.",
        "Step 5: Test the result and fix errors.",
        "",
        "Important: This is a planning draft, not executable code."
      ].join("\n");
    }

    return [
      "AI CHAT DEMO",
      "",
      "Your topic: " + topic,
      "",
      "Here is a simple way to approach this topic:",
      "1. Identify the main question.",
      "2. Break it into smaller parts.",
      "3. Research reliable information.",
      "4. Review the result and improve it.",
      "",
      "Note: This is a sample response generated by the website's local demo. It is not a live AI answer."
    ].join("\n");
  }

  if (generateButton) {
    generateButton.addEventListener("click", function () {
      const prompt = workspacePrompt ? workspacePrompt.value.trim() : "";

      if (!prompt) {
        showToast("Please enter your idea first.");
        if (workspacePrompt) workspacePrompt.focus();
        return;
      }

      if (workspaceOutput) {
        workspaceOutput.textContent = createDemoDraft(activeTool, prompt);
      }

      if (workspaceResult) {
        workspaceResult.hidden = false;
      }

      showToast("Your demo draft is ready!");
    });
  }

  /* ===== COPY DRAFT ===== */
  if (copyDraftButton) {
    copyDraftButton.addEventListener("click", async function () {
      const text = workspaceOutput ? workspaceOutput.textContent : "";

      if (!text) {
        showToast("There is no draft to copy.");
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
        showToast("Draft copied successfully!");
      } catch (error) {
        const temporaryArea = document.createElement("textarea");

        temporaryArea.value = text;
        temporaryArea.style.position = "fixed";
        temporaryArea.style.opacity = "0";

        document.body.appendChild(temporaryArea);
        temporaryArea.select();

        const copied = document.execCommand("copy");

        temporaryArea.remove();

        showToast(
          copied ? "Draft copied successfully!" : "Please select and copy the draft manually."
        );
      }
    });
  }

  /* ===== CONTACT FORM ===== */
  const contactForm = $("#contactForm");

  if (contactForm) {
    contactForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const name = $("#contactName")?.value.trim() || "";
      const email = $("#contactEmail")?.value.trim() || "";
      const subject = $("#contactSubject")?.value.trim() || "";
      const message = $("#contactMessage")?.value.trim() || "";

      const body =
        "Name: " + name +
        "\nEmail: " + email +
        "\n\nMessage:\n" + message;

      /*
        Replace YOUR_EMAIL@example.com with your real email address
        before publishing the website.
      */
      const recipient = "YOUR_EMAIL@example.com";

      const mailto =
        "mailto:" + recipient +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);

      window.location.href = mailto;

      showToast("Check your email app to review and send the message.");
    });
  }

  /* ===== NEWSLETTER DEMO ===== */
  const newsletterForm = $("#newsletterForm");

  if (newsletterForm) {
    newsletterForm.addEventListener("submit", function (event) {
      event.preventDefault();

      showToast("Demo only: newsletter subscriptions are not saved.");

      newsletterForm.reset();
    });
  }

  /* ===== IMAGE FALLBACK ===== */
  $$("img").forEach(function (img) {
    img.addEventListener("error", function () {
      img.style.display = "none";
    });
  });

  /* ===== INITIALIZE ===== */
  document.documentElement.classList.add("js-ready");

  console.log("Piyush AI World demo initialized successfully.");

});
</script>
